name: dotnest
description: 'DotNest - A desktop tool for Dart API extraction and Yuque documentation sync.'
publish_to: 'none'
version: 0.6.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # ui
  flutter_screenutil: ^5.9.3
  # 状态管理
  provider: ^6.1.5+1
  # 网络
  dio: ^5.10.0
  retrofit: ^4.9.2
  json_annotation: ^4.12.0
  # 路由
  go_router: ^17.3.0
  # 存储
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  # 工具
  file_picker: ^11.0.2
  path: ^1.9.1
  # Dart 源码分析
  analyzer: ^13.0.0
  dart_style: ^3.1.9
  # YAML 配置解析
  yaml: ^3.1.3
  # 读取运行时应用版本号
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.0
  retrofit_generator: ^10.2.6
  go_router_builder: ^4.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
