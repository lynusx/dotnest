name: Release Desktop Builds

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from pubspec.yaml
        id: get-version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version:[[:space:]]*//' | cut -d '+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: read-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package artifact
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dotnest-windows-${{ needs.read-version.outputs.version }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dotnest-windows-${{ needs.read-version.outputs.version }}.zip

  build-macos:
    needs: read-version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package artifact
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/dotnest.app dotnest-macos-${{ needs.read-version.outputs.version }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dotnest-macos-${{ needs.read-version.outputs.version }}.zip

  release:
    needs: [read-version, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.read-version.outputs.version }}
          name: v${{ needs.read-version.outputs.version }}
          files: |
            dotnest-windows-${{ needs.read-version.outputs.version }}.zip
            dotnest-macos-${{ needs.read-version.outputs.version }}.zip
